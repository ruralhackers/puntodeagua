name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      # Unit tests only. The integration suite lives under
      # apps/webapp/src/server and needs a database, so it runs in its own
      # workflow: a bare `bun test` here would pick it up and fail.
      - name: Run unit tests
        run: bun run test:unit
        env:
          NODE_ENV: test
